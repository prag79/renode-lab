name: Build & push Renode image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - '.github/workflows/build.yml'
      - 'lab'
      - 'sync-labs.sh'
      - 'entrypoint.sh'
      - 'labs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          # Build context is the repo root, not .devcontainer/, because the
          # Dockerfile does `COPY labs/ /labs/` and `COPY lab /usr/local/bin/lab`
          # and those live at the repo root. (We learned this on the gem5
          # sister-doc; with context: .devcontainer those COPYs fail.)
          context: .
          file:    .devcontainer/Dockerfile
          push:    true
          tags: |
            ghcr.io/${{ github.repository_owner }}/renode-lab:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
